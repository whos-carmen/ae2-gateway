plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'dev.ae2gateway'
version = '0.1.0'

base {
    archivesName = 'ae2-gateway'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                ae2_gateway {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'
    implementation fg.deobf('local:appliedenergistics2-forge:15.5.4-uelm')
    runtimeOnly fg.deobf('org.appliedenergistics:guideme:20.1.7')

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest {
        attributes(
            'Specification-Title': 'AE2 Gateway',
            'Specification-Version': project.version,
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        )
    }
    finalizedBy 'reobfJar'
}
